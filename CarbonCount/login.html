<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarbonCount™</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&family=Playfair+Display:ital,wght@1,500&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="stylesheet" href="styles/main.css">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            padding-top: 0;
            /* Removed padding */
        }

        #particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-layout {
            position: relative;
            z-index: 10;
            height: 100vh;
            /* Full height */
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* LHS: Vision Quote */
        .vision-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6rem;
            position: relative;
        }

        .back-home-arrow {
            position: fixed;
            /* Fixed position */
            top: 2rem;
            left: 2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            z-index: 1000;
            /* High z-index */
        }

        .back-home-arrow:hover {
            transform: scale(1.1);
            background: rgba(0, 255, 163, 0.1);
            border-color: var(--clr-primary);
            color: var(--clr-primary);
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.2);
        }

        .vision-quote {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            margin-bottom: 2rem;
            position: relative;
        }

        .vision-attribution {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--font-main);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--clr-primary);
        }

        .attribution-line {
            width: 40px;
            height: 1px;
            background: var(--clr-primary);
        }

        /* RHS: Glass Card */
        .form-side {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.03);
            /* More transparent */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: white;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            color: var(--clr-text-muted);
            transition: color 0.3s;
            font-weight: 500;
        }

        .tab.active {
            color: white;
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50%;
            height: 2px;
            background: var(--clr-primary);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Social Auth */
        .social-btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: var(--radius-md);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 1rem;
        }

        .btn-google {
            background: #fff;
            color: #1f2937;
        }

        .btn-apple {
            background: #000;
            color: #fff;
            border: 1px solid #333;
        }

        .social-btn:hover {
            transform: scale(1.02);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--clr-text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 1rem;
        }

        /* Inputs */
        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-dark {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: white;
            transition: border-color 0.3s;
        }

        .input-dark:focus {
            outline: none;
            border-color: var(--clr-primary);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--clr-text-muted);
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .vision-side {
                display: none;
            }

            .login-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Standardized Fixed Navbar -->
    <!-- Navbar Removed for Distraction-Free Mode -->

    <!-- Layer 0: Particles -->
    <div id="particle-bg"></div>

    <!-- Layer 1: Content -->
    <div class="login-layout">

        <!-- LHS -->
        <div class="vision-side">
            <!-- Back Arrow -->
            <a href="index.html" class="back-home-arrow" title="Back to Home">
                <i data-lucide="chevron-left"></i>
            </a>

            <div class="vision-quote">
                "Decarbonization is not just compliance. It is the new currency of global trade."
            </div>
            <div class="vision-attribution">
                <div class="attribution-line"></div>
                The CarbonCount Vision
            </div>
        </div>

        <!-- RHS -->
        <div class="form-side">
            <div class="glass-card">
                <div class="logo-header">
                    <img src="assets/logo.png" alt="CarbonCount" style="height: 40px; width: auto;">
                    CarbonCount
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <div class="tab active" onclick="switchTab('login')">Login</div>
                    <div class="tab" onclick="switchTab('signup')">Sign Up</div>
                    <div class="tab-indicator" id="tab-indicator"></div>
                </div>

                <!-- Social -->
                <button class="social-btn btn-google" id="google-signin-btn" onclick="handleGoogleSignIn()">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>

                <div class="divider"><span>OR</span></div>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input type="email" class="input-dark" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="input-dark" placeholder="Password" required>
                        <i data-lucide="eye" class="toggle-password" onclick="togglePassword()"></i>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 2rem; font-size: 0.9rem;">
                        <label
                            style="color: var(--clr-text-muted); display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" style="color: var(--clr-primary); text-decoration: none;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 1.5rem;">Sign
                        In</button>

                    <div style="text-align: center; color: var(--clr-text-muted); font-size: 0.9rem;">
                        Don't have an account? <a href="#" onclick="switchTab('signup')"
                            style="color: white; text-decoration: none; font-weight: 500;">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Reuse Particle Logic (Simulated for single file completeness, normally referenced) -->
    <script>
        // Init Particles in #particle-bg (Heavy Molecular)
        // Basic Three.js setup for background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('particle-bg').appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const count = 2000;
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 15;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0x00ffa3, size: 0.03, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.002; // Rotate
            renderer.render(scene, camera);
        }
        animate();

        // UI Logic
        lucide.createIcons();

        function handleLogin(e) {
            e.preventDefault();
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'user-profile.html';
        }

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function switchTab(tab) {
            const indicator = document.getElementById('tab-indicator');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                indicator.style.transform = 'translateX(0)';
            } else {
                tabs[1].classList.add('active');
                indicator.style.transform = 'translateX(100%)';
            }
        }
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { auth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './scripts/firebase-config.js';
        import './scripts/user-profile-manager.js';

        // Google Sign-In
        window.handleGoogleSignIn = async function () {
            try {
                const result = await window.userProfileManager.signInWithGoogle();
                if (result.success) {
                    alert('✅ Signed in successfully!');
                    window.location.href = 'user-profile.html';
                } else {
                    alert('❌ Sign-in failed: ' + result.error);
                }
            } catch (error) {
                console.error('Google sign-in error:', error);
                alert('❌ Sign-in failed. Please try again.');
            }
        };

        // Email/Password Login
        window.handleLogin = async function (e) {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;

            try {
                const result = await window.userProfileManager.signInWithEmail(email, password);
                if (result.success) {
                    alert('✅ Logged in successfully!');
                    window.location.href = 'user-profile.html';
                } else {
                    alert('❌ Login failed: ' + result.error);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('❌ Login failed. Please check your credentials.');
            }
        };

        // Email/Password Sign-Up
        window.handleSignUp = async function (e) {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            const displayName = e.target.querySelector('input[name="name"]')?.value || '';

            try {
                const result = await window.userProfileManager.signUpWithEmail(email, password, displayName);
                if (result.success) {
                    alert('✅ Account created successfully!');
                    window.location.href = 'user-profile.html';
                } else {
                    alert('❌ Sign-up failed: ' + result.error);
                }
            } catch (error) {
                console.error('Sign-up error:', error);
                alert('❌ Sign-up failed. Please try again.');
            }
        };
    </script>

    <script src="scripts/mobile.js"></script>
</body>

</html>
